services:
  labellingsoftware:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - labelling_data:/app/data
      - labelling_uploads:/app/uploads
    restart: unless-stopped

volumes:
  labelling_data:
    name: labelling_data
  labelling_uploads:
    name: labelling_uploads
